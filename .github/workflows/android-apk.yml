name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Family Records
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Require the Supabase project settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Add Actions secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY, then rerun this workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run android:apk

      - name: Name the package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk family-records.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: family-records-apk
          path: family-records.apk
          if-no-files-found: error

      - name: Summarize the run
        run: echo "Download family-records.apk from the artifacts on this run, copy it to the phone, and open it to install." >> "$GITHUB_STEP_SUMMARY"
